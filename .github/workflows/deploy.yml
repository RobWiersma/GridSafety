name: Deploy

# Manual only (Actions → Deploy → Run workflow): needs the AWS role from docs/github-oidc.md,
# and an always-on deploy would fail on every push until that is set up.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write   # GitHub OIDC -> AWS IAM role; no long-lived AWS keys in GitHub
  contents: read

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: dotnet test -c Release
      - name: Deploy
        run: |
          ARGS=()
          [ -n "${{ vars.OPS_EMAIL }}" ] && ARGS+=(-c "opsEmail=${{ vars.OPS_EMAIL }}")
          [ -n "${{ vars.MONTHLY_BUDGET_USD }}" ] && ARGS+=(-c "monthlyBudgetUsd=${{ vars.MONTHLY_BUDGET_USD }}")
          bash scripts/deploy.sh "${{ inputs.stage || 'dev' }}" "${ARGS[@]}" --outputs-file cdk-outputs.json
      - name: Smoke test
        run: |
          SITE=$(jq -r '.[] | .SiteUrl' cdk-outputs.json)
          curl --fail --retry 5 --retry-delay 10 "$SITE/api/health"
          curl --fail "$SITE/" | grep -q '<div id="root">'
          echo "### Deployed :rocket: $SITE" >> "$GITHUB_STEP_SUMMARY"
